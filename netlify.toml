[build]
  publish = "."
  functions = "netlify/functions"
  # Records test or live Stripe mode and the shipping and tax settings for this deploy
  command = "node scripts/apply-stripe-settings.js"

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/stock"
  to = "/.netlify/functions/stock"
  status = 200

[[redirects]]
  from = "/api/products"
  to = "/.netlify/functions/products"
  status = 200
