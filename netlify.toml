[build]
  publish = "."
  functions = "netlify/functions"
  # Picks the test or live Stripe IDs for this deploy (see STRIPE-ENVIRONMENTS.md)
  command = "node scripts/apply-stripe-ids.js"

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/stock"
  to = "/.netlify/functions/stock"
  status = 200
