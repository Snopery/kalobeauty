<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KALOBEAUTY</title>
<meta name="description" content="KALOBEAUTY eyebrow and lash beauty. Browse lash extensions, lifts, tints and brow services, then book online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&amp;family=Source+Sans+3:wght@400;600&amp;display=swap">
<style>
:root{--bg:#EFE1E1;--ink:#1C1214;--paper:#F8F1F1;--blush:#E6D2D3;--line:#D4BBBE;--muted:#5E444A;--rose:#8F4B57;--serif:'Source Serif 4','Source Serif Pro',Georgia,serif;--sans:'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
a,button{transition:background .2s,color .2s,border-color .2s,transform .15s,box-shadow .15s}
a:focus-visible,button:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding-left:clamp(16px,4vw,48px);padding-right:clamp(16px,4vw,48px)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 24px;padding-top:10px;padding-bottom:10px}
.brand{font-family:var(--serif);font-size:20px;letter-spacing:.34em;color:var(--ink);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:0 22px}
.nav-link{color:var(--ink);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.nav-link:hover{color:var(--rose)}
.btn{background:var(--ink);color:var(--paper);text-decoration:none;min-height:44px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:600;letter-spacing:.04em}
.btn:hover{background:var(--rose)}
.btn:active,.tab:active{transform:scale(.97)}
.btn.big{min-height:52px;width:100%;padding:0 28px}
.btn.light{background:var(--bg);color:var(--ink)}
.btn.light:hover{background:var(--paper)}
h1,h2,h3{font-family:var(--serif);font-weight:300;margin:0;text-wrap:balance}
.hero{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 32px;padding-top:clamp(4px,1.5vw,16px);padding-bottom:20px}
.hero h1{font-size:clamp(30px,4.2vw,50px);line-height:1.05;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted)}
.panels{display:flex;flex-wrap:wrap;align-items:stretch;gap:20px;padding-bottom:clamp(28px,4vw,48px)}
.panel{flex:1 1 380px;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font:inherit;font-size:15px;font-weight:600;cursor:pointer;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #BFA2A6;background:transparent;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.tab:hover{border-color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.count{font-size:13px;min-width:20px;height:20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:rgba(28,18,20,.1)}
.tab[aria-pressed="true"] .count{background:rgba(248,241,241,.22)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px 12px;padding:4px 4px 2px}
.tile{font:inherit;color:var(--ink);text-align:left;cursor:pointer;background:none;border:0;padding:0;display:flex;flex-direction:column;gap:7px;min-width:0}
.thumb{position:relative;display:block;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--blush);box-shadow:0 0 0 1px #CDB3B6}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%;display:block}
.thumb svg{position:absolute;inset:0;width:100%;height:100%;padding:14%}
.tile:hover .thumb{box-shadow:0 0 0 2px var(--rose);transform:translateY(-3px)}
.tile[aria-pressed="true"] .thumb{box-shadow:0 0 0 3px var(--ink);transform:scale(1.05)}
.tile:active .thumb{transform:scale(.95)}
.price-chip{position:absolute;left:6px;bottom:6px;background:var(--paper);color:var(--ink);font-size:13px;font-weight:600;line-height:1;padding:4px 8px;border-radius:999px}
.check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:999px;background:var(--ink);color:var(--paper);display:inline-flex;align-items:center;justify-content:center}
.nm{font-size:14px;line-height:1.2;font-weight:600;overflow-wrap:anywhere}
.note{margin:auto 0 0;border-top:1px solid #E1CDD0;padding-top:12px;color:var(--muted);font-size:15px}
.photo{position:relative;overflow:hidden;background:var(--blush);border-radius:14px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%;display:block}
.photo svg{width:68%;height:auto;display:block}
.tag{position:absolute;top:14px;left:14px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:600;letter-spacing:.05em;padding:4px 14px;border-radius:999px}
.title-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 20px}
.title-row h2{flex:1 1 240px;min-width:0;font-weight:400;font-size:clamp(24px,3vw,32px);line-height:1.15}
.big-price{font-family:var(--serif);font-size:28px;line-height:1.1;white-space:nowrap}
.big-price small{font-family:var(--sans);font-size:16px;color:var(--muted)}
.desc{margin:0;max-width:40em;color:#3D2B2F}
.stage .btn.big{margin-top:auto}
.refill{padding-bottom:clamp(36px,5vw,64px)}
.refill-box{background:var(--blush);border-radius:20px;padding:clamp(20px,3vw,36px);display:flex;flex-wrap:wrap;align-items:center;gap:24px clamp(24px,4vw,48px)}
.refill-box .l{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:14px}
.refill-box h2{font-size:clamp(26px,3.4vw,38px);line-height:1.1}
.refill-box p{margin:0;color:#4A3439}
.refill-box .tab{background:var(--paper);border-color:#B79A9E}
.refill-box .tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.refill-card{flex:1 1 320px;min-width:0;background:var(--paper);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.refill-card h3{font-weight:400;font-size:24px;line-height:1.2}
footer{background:var(--ink);color:var(--bg)}
footer .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px;padding-top:clamp(24px,3.5vw,40px);padding-bottom:clamp(24px,3.5vw,40px)}
footer .brand{color:var(--bg);min-height:0}
footer small{display:block;color:#D9C5C6;font-size:15px}
footer a:focus-visible{outline-color:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none !important;scroll-behavior:auto !important}}
</style>

    tint: [{ d: lashD(function () { return true; }, 0, 1, 1), s: INK, w: 5 }, LID, LOW, { d: 'M520 40 C508 64 490 80 490 100 A30 30 0 0 0 550 100 C550 80 532 64 520 40 Z', s: 'none', w: 0, f: ROSE }],
    liftext: [{ d: lashD(function (i) { return i % 4 !== 2; }, 0, 1, 2.4), s: INK, w: 2.4 }, { d: lashD(function (i) { return i % 4 === 2; }, 0, 1.35, 2.4), s: ROSE, w: 3.6 }, LID, LOW, BADGE, sign('M520 98 V62 M504 78 L520 62 L536 78')],
    liftbrow: [BROW, { d: lashD(function () { return true; }, 0, 1, 2.4), s: INK, w: 2.4 }, LID, LOW],
    browwax: [{ d: 'M100 230 Q290 80 500 170', s: INK, w: 22 }, { d: 'M170 262 l-8 24 M235 236 l-6 26 M305 214 l-4 26', s: ROSE, w: 4, da: [7, 8] }, { d: 'M390 318 L500 258', s: ROSE, w: 30 }],
    lipwax: [{ d: 'M170 210 Q235 160 300 192 Q365 160 430 210 Q300 226 170 210 Z', s: INK, w: 4 }, { d: 'M170 210 Q300 320 430 210', s: INK, w: 4 }, { d: 'M235 120 l0 26 M270 108 l0 30 M300 104 l0 32 M330 108 l0 30 M365 120 l0 26', s: ROSE, w: 5 }],
    chinwax: [{ d: 'M120 110 Q120 330 300 348 Q480 330 480 110', s: INK, w: 4 }, { d: 'M240 280 l0 -26 M270 292 l0 -30 M300 296 l0 -32 M330 292 l0 -30 M360 280 l0 -26', s: ROSE, w: 5 }],
    sidewax: [{ d: 'M370 60 Q300 190 370 330', s: INK, w: 4 }, { d: 'M296 120 H336 M290 165 H330 M290 210 H334 M300 255 H344', s: ROSE, w: 6 }]
  };
  function artSvg(id, k, cap) {
    var out = '<svg viewBox="0 0 600 380" aria-hidden="true" focusable="false" fill="none" stroke-linecap="round" stroke-linejoin="round">';
    ART[kindOf(id)].forEach(function (p) {
      var w = Math.min(p.w * k, cap);
      out += '<path d="' + p.d + '" stroke="' + p.s + '" stroke-width="' + w + '" fill="' + (p.f || 'none') + '"' + (p.da ? ' stroke-dasharray="' + (p.da[0] * k) + ' ' + (p.da[1] * k) + '"' : '') + '/>';
    });
    return out + '</svg>';
  }

  var state = { cat: 'lash', sel: 'glam-wispy', refill: '2' };
  var el = function (id) { return document.getElementById(id); };
  var ARROW = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var CHECK = '<span class="check"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>';

  function render() {
    var active = document.activeElement && document.activeElement.getAttribute('data-k');
    var items = DATA.filter(function (d) { return d.cat === state.cat; });
    var cur = items.filter(function (d) { return d.id === state.sel; })[0] || items[0];
    state.sel = cur.id;

    el('tabs').innerHTML = CATS.map(function (c) {
      var n = DATA.filter(function (d) { return d.cat === c.id; }).length;
      return '<button class="tab" type="button" data-k="cat-' + c.id + '" data-cat="' + c.id + '" aria-pressed="' + (c.id === state.cat) + '"><span>' + c.label + '</span><span class="count">' + n + '</span></button>';
    }).join('');

    el('grid').innerHTML = items.map(function (d) {
      var on = d.id === cur.id;
      var inner = IMG[d.id] ? '<img src="' + IMG[d.id] + '" alt="">' : artSvg(d.id, 4, 36);
      return '<button class="tile" type="button" data-k="svc-' + d.id + '" data-svc="' + d.id + '" aria-pressed="' + on + '"><span class="thumb">' + inner + '<span class="price-chip">' + d.price + '</span>' + (on ? CHECK : '') + '</span><span class="nm">' + SHORT[d.id] + '</span></button>';
    }).join('');

    el('note').textContent = NOTES[state.cat];

    var photo = IMG[cur.id] ? '<img src="' + IMG[cur.id] + '" alt="' + cur.name + '">' : artSvg(cur.id, 1, 999);
    el('stage').innerHTML =
      '<div class="photo">' + photo + (cur.tag ? '<span class="tag">' + cur.tag + '</span>' : '') + '</div>' +
      '<div class="title-row"><h2>' + cur.name + '</h2><span class="big-price">' + cur.price + ' <small>/ ' + cur.time + '</small></span></div>' +
      '<p class="desc">' + cur.desc + '</p>' +
      '<a class="btn big" href="' + A(cur.aid) + '" target="_blank" rel="noopener">Book this service' + ARROW + '</a>';

    var rc = R.filter(function (r) { return r.id === state.refill; })[0] || R[0];
    el('refill-opts').innerHTML = R.map(function (r) {
      return '<button class="tab" type="button" data-k="ref-' + r.id + '" data-refill="' + r.id + '" aria-pressed="' + (r.id === rc.id) + '">' + r.label + '</button>';
    }).join('');
    el('refill-card').innerHTML =
      '<div><h3>' + rc.name + '</h3><p style="margin:6px 0 0">' + rc.note + '</p></div>' +
      '<span class="big-price">' + rc.price + ' <small>/ ' + rc.time + '</small></span>' +
      '<a class="btn big" href="' + A(rc.aid) + '" target="_blank" rel="noopener">Book this refill' + ARROW + '</a>';

    if (active) {
      var again = document.querySelector('[data-k="' + active + '"]');
      if (again) again.focus();
    }
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-cat],[data-svc],[data-refill]');
    if (!b) return;
    if (b.hasAttribute('data-cat')) {
      state.cat = b.getAttribute('data-cat');
      state.sel = DATA.filter(function (d) { return d.cat === state.cat; })[0].id;
    } else if (b.hasAttribute('data-svc')) {
      state.sel = b.getAttribute('data-svc');
    } else {
      state.refill = b.getAttribute('data-refill');
    }
    render();
  });

  render();
})();
</script>
