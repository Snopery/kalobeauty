<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KALOBEAUTY</title>
<meta name="description" content="KALOBEAUTY eyebrow and lash beauty. Browse lash extensions, lifts, tints and brow services, then book online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&amp;family=Source+Sans+3:wght@400;600&amp;display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="wrap">
<a class="brand" href="#top" id="top">KALOBEAUTY</a>
<nav aria-label="Page sections">
<a class="nav-btn" href="#services">Services</a>
<a class="nav-btn" href="#refill" id="refill-nav">Refill guide</a>
<a class="nav-btn" href="#gallery" id="gallery-nav">Gallery</a>
</nav>
</div></header>

<main>
<section id="services" class="wrap">
<div class="hero">
<h1>Brows and lashes, finished with care.</h1>
<p>Pick a category, tap a tile, then book.</p>
</div>
<div class="panels">
<div class="panel">
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<p class="note" id="note"></p>
</div>
<div class="panel stage" id="stage"></div>
</div>
</section>

<section id="refill" class="wrap refill">
<div class="refill-box">
<div class="l">
<h2 id="refill-title">Which lash refill do you need?</h2>
<p id="refill-q">How much growth since your last set?</p>
<div class="tabs" id="refill-opts"></div>
</div>
<div class="refill-card" id="refill-card"></div>
</div>
</section>
<section id="gallery" class="wrap gallery" aria-labelledby="gallery-title">
<div class="g-head">
<h2 id="gallery-title"></h2>
<div class="g-arrows">
<button class="g-arrow" type="button" id="g-prev" aria-label="Scroll gallery left"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
<button class="g-arrow" type="button" id="g-next" aria-label="Scroll gallery right"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>
</div>
<div class="g-strip" id="g-strip" tabindex="-1"></div>
</section>
</main>

<footer><div class="wrap">
<div><span class="brand">KALOBEAUTY</span><small>Eyebrow and lash beauty</small></div>
<a class="btn light" href="#" data-book target="_blank" rel="noopener" style="min-height:48px;padding:0 32px">Book online</a>
</div></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo gallery" hidden>
<button class="lb-btn lb-close" type="button" id="lb-close" aria-label="Close gallery">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<button class="lb-btn lb-prev" type="button" id="lb-prev" aria-label="Previous photo">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="lb-btn lb-next" type="button" id="lb-next" aria-label="Next photo">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
<figure class="lb-fig"><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
</div>

<!-- Edit services in data/services.js, not here. -->
<script src="data/services.js"></script>
<script src="js/app.js"></script>
</body>
</html>
